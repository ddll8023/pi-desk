# 便携出包配置：按平台产出免安装目录与 zip 压缩包，不产出安装器。
#
# asar 必须关闭：渲染资源由自定义协议从磁盘读取，处理里对真实路径做 realpath 与 file:// 读取，
# 归档内的文件对这两条路径都不可用。
#
# 架构不在这里声明：目标架构由 scripts/package-portable.mjs 按当前主机架构传入，
# 原生依赖（含 pi-tui 的平台预编译产物）只保证与安装时的架构一致。
appId: io.pidesk.desktop
asar: false
# 原生依赖（node-pty）自带 N-API 预编译产物，ABI 稳定，可直接用于任意 Electron 版本。
# 不重编译：本机编译需要工具链，重编译出的未签名二进制还会被杀软误报；因此关闭自动重建。
npmRebuild: false
directories:
  output: release
  buildResources: build
# 只收构建产物；package.json 与生产依赖的 node_modules 由 electron-builder 固定纳入。
# 受管入口（SDK 宿主、CLI 运行器、版本检查脚本、认证辅助进程）以裸模块名解析官方 SDK，
# 因此生产依赖必须落在应用目录的 node_modules 下。node-pty 的 prebuilds/（含 conpty.dll）
# 必须一并随包，任何过滤规则都不能排除它，否则终端无法启动。
# 终端守护进程入口是 out/terminal-daemon/index.cjs：它由应用用 Electron 自带的 Node 拉起后脱离运行，
# 同样从应用目录的 node_modules 解析 node-pty 与 @xterm/headless，两者都是生产依赖，不能移到 devDependencies。
files:
  - package.json
  - out/**
win:
  # 用预生成的多尺寸 .ico（源是 build/icon.svg），不用 .svg：electron-builder 的 SVG 转换工具
  # （resvg + libvips WASM）会为每个 CPU 核分配一个 1 GiB、不可增长的共享 WebAssembly 内存，
  # 核数多或系统提交内存紧张时必然失败，表现为打包目录已生成、没有任何压缩包、退出码 1。
  # 改 build/icon.svg 后必须重新生成并覆盖 build/icon.ico，不能让出包现场去转 SVG。
  icon: build/icon.ico
  target:
    - zip
  artifactName: pi-desk-${version}-win-${arch}.${ext}
mac:
  icon: build/icon.svg
  target:
    - zip
  category: public.app-category.developer-tools
  # ad-hoc 签名：无证书也能在本机直接运行；electron-builder 会带上内置的
  # allow-jit 与 disable-library-validation entitlements。换正式证书时改用 CSC_* 环境变量。
  identity: "-"
  artifactName: pi-desk-${version}-mac-${arch}.${ext}
